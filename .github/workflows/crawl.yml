name: 뮤지컬 데이터 자동 수집
on:
  schedule: [{cron: '0 21 * * *'}]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: OCR 엔진 설치
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: 라이브러리 설치
        run: pip install requests anthropic pytesseract pillow
      - name: 크롤링 실행
        env: {KOPIS_SERVICE_KEY: '${{ secrets.KOPIS_SERVICE_KEY }}', ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}'}
        run: python scripts/crawl_all.py
      - name: 결과 커밋
        run: git config user.name "musical-bot" && git config user.email "bot@users.noreply.github.com" && git add docs/data/*.json && (git diff --cached --quiet || git commit -m "auto update") && git push
