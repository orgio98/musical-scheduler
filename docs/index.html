<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>커튼콜 — 뮤지컬 스케줄러</title>
<style>
  :root{
    --bg:#1B0F14;          /* 암전된 객석 */
    --surface:#2A1A21;     /* 무대 아래 */
    --surface2:#332028;
    --curtain:#A03448;     /* 커튼 레드 */
    --gold:#E9B44C;        /* 스포트라이트 */
    --gold-soft:rgba(233,180,76,.16);
    --ink:#F5ECE6;
    --muted:#B39AA2;
    --line:rgba(233,180,76,.14);
    --serif:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px calc(24px + env(safe-area-inset-bottom))}

  /* ── 헤더 ── */
  header{padding:22px 2px 14px;display:flex;align-items:baseline;justify-content:space-between}
  .brand{font-family:var(--serif);font-size:26px;letter-spacing:.02em}
  .brand em{font-style:normal;color:var(--gold)}
  .brand-sub{font-size:10.5px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}

  /* ── 탭 ── */
  nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
  nav button{background:var(--surface);border:1px solid var(--line);color:var(--muted);
    padding:10px 0;border-radius:10px;font-size:13.5px;font-family:var(--sans);cursor:pointer}
  nav button.on{background:var(--curtain);border-color:var(--curtain);color:#fff;font-weight:600}
  nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px}

  section{display:none}
  section.on{display:block;animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){section.on{animation:none}}

  /* ── 공통 부품 ── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .h{font-family:var(--serif);font-size:17px;margin-bottom:10px;color:var(--ink)}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.55}
  .btn{background:var(--curtain);color:#fff;border:none;border-radius:10px;padding:11px 14px;
    font-size:14px;font-family:var(--sans);cursor:pointer;font-weight:600}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400}
  .btn.gold{background:var(--gold);color:#2A1208}
  input[type=text],input[type=date],input[type=number],select{
    width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:11px 12px;font-size:14px;font-family:var(--sans)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
  a{color:var(--gold)}

  /* ── 달력 ── */
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-month{font-family:var(--serif);font-size:20px;letter-spacing:.04em}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{background:var(--surface);border:1px solid var(--line);color:var(--ink);
    width:36px;height:36px;border-radius:9px;font-size:15px;cursor:pointer}
  .show-filter{margin-bottom:10px}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#2A1208;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0 7px}
  .dow.sun{color:#D97A8A}
  .cell{aspect-ratio:1/1.06;background:var(--surface);border:1px solid transparent;border-radius:10px;
    padding:5px 4px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center}
  .cell.out{opacity:.28;cursor:default}
  .cell .d{font-family:var(--serif);font-size:14px;line-height:1.2}
  .cell.sun .d{color:#D97A8A}
  .cell .dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:3px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--curtain)}
  .dot.ev{background:var(--gold);border-radius:1px}
  .cell.today{border-color:var(--muted)}
  .cell.sel{border-color:var(--curtain)}
  /* 시그니처: 스포트라이트 — 선택 배우 출연일 */
  .stage-dim .cell:not(.spot):not(.out){opacity:.34}
  .cell.spot{background:radial-gradient(circle at 50% 32%,var(--gold-soft),var(--surface) 78%);
    border-color:var(--gold);box-shadow:0 0 14px rgba(233,180,76,.22)}
  .cell.spot .d{color:var(--gold);font-weight:700}

  .day-detail{margin-top:12px}
  .slot{border-top:1px solid var(--line);padding:10px 2px}
  .slot:first-of-type{border-top:none}
  .slot .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .slot .t b{font-size:14.5px}
  .slot .t span{font-family:var(--serif);color:var(--gold);font-size:13px}
  .castline{font-size:13px;color:var(--muted);line-height:1.6}
  .castline i{font-style:normal;color:var(--ink)}
  .castline i.hl{color:var(--gold);font-weight:700}
  .round{display:flex;gap:8px;margin-top:7px;font-size:13px;line-height:1.65}
  .round .rt{flex:0 0 auto;font-family:var(--serif);color:var(--gold);font-size:12.5px;
    background:var(--gold-soft);border-radius:6px;padding:1px 7px;height:fit-content;margin-top:1px}
  .round .rc{color:var(--muted);overflow-wrap:anywhere}
  .round .rc i{font-style:normal;color:var(--ink)}
  .round .rc i.hl{color:var(--gold);font-weight:700}
  .round .rc u{text-decoration:none;color:var(--muted);font-size:11.5px;opacity:.8}

  /* ── 공연 목록 ── */
  .m-item{display:flex;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
  .m-item:first-of-type{border-top:none}
  .poster{width:56px;height:76px;flex:0 0 56px;border-radius:7px;object-fit:cover;
    background:var(--surface2);border:1px solid var(--line)}
  .m-info{min-width:0;flex:1}
  .m-info .name{font-size:14.5px;font-weight:700;margin-bottom:3px}
  .m-info .meta{font-size:12px;color:var(--muted);line-height:1.55;overflow-wrap:anywhere}
  .m-info .mt{color:var(--gold);font-family:var(--serif);font-size:12.5px}
  .m-info .mp{color:var(--ink)}
  .badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;
    background:var(--gold-soft);color:var(--gold);margin-left:6px;vertical-align:1px}

  /* ── 필터 토글 ── */
  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tgl{display:inline-flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;
    color:var(--muted);cursor:pointer;user-select:none}
  .tgl:has(input:checked){background:var(--curtain);border-color:var(--curtain);color:#fff;font-weight:600}
  .tgl input{appearance:none;width:14px;height:14px;border:1.5px solid currentColor;border-radius:4px;
    margin:0;position:relative;cursor:pointer;flex:0 0 14px}
  .tgl input:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-size:11px;line-height:1;color:#fff}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 8px;line-height:1.7}
  .empty b{font-family:var(--serif);color:var(--ink);font-size:15px;display:block;margin-bottom:5px}

  .file-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .stat{font-size:12px;color:var(--muted)}
  .stat b{color:var(--gold)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--gold);
    color:#2A1208;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand">커튼<em>콜</em></div>
      <div class="brand-sub">Musical Scheduler</div>
    </div>
    <div style="text-align:right">
      <div class="stat" id="dataStat"></div>
      <div class="stat" id="syncStat" style="font-size:11px;margin-top:3px"></div>
      <button class="btn ghost" id="syncBtn" style="margin-top:6px;padding:6px 10px;font-size:12px" aria-label="새로고침">↻ 새로고침</button>
    </div>
  </header>

  <nav style="grid-template-columns:repeat(2,1fr)">
    <button class="on" data-tab="cal">달력</button>
    <button data-tab="shows">공연</button>
  </nav>

  <!-- ═══ 달력 ═══ -->
  <section id="tab-cal" class="on">
    <div class="show-filter">
      <select id="showFilter" aria-label="공연 필터"></select>
    </div>
    <div class="chips" id="actorChips" aria-label="배우 선택"></div>
    <div class="card">
      <div class="cal-top">
        <div class="cal-month" id="calMonth"></div>
        <div class="cal-nav">
          <button id="prevM" aria-label="이전 달">◀</button>
          <button id="nextM" aria-label="다음 달">▶</button>
        </div>
      </div>
      <div class="grid" id="calHead"></div>
      <div class="grid" id="calGrid"></div>
    </div>
    <div class="card day-detail" id="dayDetail"></div>
  </section>

  <!-- ═══ 공연 ═══ -->
  <section id="tab-shows">
    <div class="card">
      <input type="text" id="showSearch" placeholder="공연명·극장 검색 (전체 공연에서 찾기)">
    </div>
    <div class="card" id="showList"></div>
  </section>

</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ─────────── 상태 (DB 모델: Musicals / Schedules / Events, Actors는 파생) ─────────── */
let musicals = [];   // {공연명,시작일,종료일,공연장,출연진,티켓가격,공연시간,예매처,포스터,상태}
let casts    = [];   // {공연명,날짜,회차,배역,배우}
let view = new Date(); view.setDate(1);
let selDate = fmt(new Date());
let selActor = null;
let selShow  = "";

const $ = id => document.getElementById(id);
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

/* ─────────── 저장/불러오기 (기기 저장 — 다시 열어도 유지) ─────────── */
async function load(key){ try{const r=await window.storage.get(key);return r?JSON.parse(r.value):null}catch(e){return null} }
async function save(key,val){ try{await window.storage.set(key,JSON.stringify(val))}catch(e){ toast("저장 실패 — 이번 세션만 유지됩니다") } }

/* ─────────── 달력 ─────────── */
/* ─────────── 공연 필터 ─────────── */
// 어린이용: 동화·캐릭터 제목이거나 '어린이/키즈' 표기가 있는 경우
const KIDS_TITLES = ["인어공주","백설공주","신데렐라","피노키오","잠자는 숲속","브레멘","헨젤","그레텔",
  "미녀와 야수","알라딘 [","피터팬","흥부","놀부","콩쥐","팥쥐","금도끼","은도끼","해님","달님",
  "아기","공룡","티라노","뽀로로","타요","핑크퐁","아기상어","코코몽","폴리","시크릿쥬쥬","비바",
  "구름빵","엄마 까투리","방귀","똥","도깨비 [","호랑이 형님"];
const KIDS_WORDS = ["어린이","키즈","유아","아동","가족뮤지컬","패밀리뮤지컬","인형극","교육뮤지컬"];
// 공연장 이름 자체가 어린이 시설인 경우
const KIDS_PLACES = ["어린이","아이들","키즈","유아","아동","대공원","놀이","랜드","테마파크",
  "동물원","아쿠아리움","체험관","유치원","어린이집"];

function isKids(s){
  const n = s.공연명 || "";
  const place = s.공연장 || "";
  // 공연장 이름에 어린이 관련 표기가 있으면 어린이 공연으로 간주
  if (KIDS_PLACES.some(w => place.includes(w))) return true;
  if (KIDS_WORDS.some(w => n.includes(w))) return true;
  // 동화 제목이어도 티켓 최고가가 높으면 대형 라이선스 공연으로 보고 남긴다
  // (예: 미녀와 야수, 알라딘 — 디즈니 라이선스 뮤지컬)
  if (KIDS_TITLES.some(t => n.includes(t))) return maxPrice(s) < BIG_PRICE;
  // 티켓 최고가가 2만원 이하면 어린이/소품 공연일 가능성이 높음
  const mx = maxPrice(s);
  return mx > 0 && mx <= 20000;
}

// 티켓 최고가 (숫자만 추출)
function maxPrice(s){
  const prices = (s.티켓가격||"").match(/[\d,]+\s*원/g);
  if(!prices) return 0;
  return Math.max(...prices.map(p => Number(p.replace(/[^\d]/g,""))));
}
// 이 금액을 넘으면 대형 라이선스 공연으로 간주 (동화 제목 예외 처리에 사용)
const BIG_PRICE = 70000;
// 전문 공연장이 아닌 시설 (박물관·과학관·학습센터 등)
const NON_VENUE = ["학습센터","평생학습","공예관","과학관","박물관","미술관","도서관","기념관",
  "문화원","수련관","청소년관","주민센터","구민회관","시민회관","동사무소","체육관","교육원",
  "연수원","복지관","센터몰","전시관","홍보관","식물원","수목원","캠핑","놀이터","키즈",
  "대공원","유원지","랜드","테마파크","동물원","아쿠아리움","체험관","광장","야외무대"];
function isNonVenue(s){
  return NON_VENUE.some(w => (s.공연장||"").includes(w));
}

// 달력에 표시할 기준 티켓가 (VIP 기준)
const CAL_MIN_PRICE = 160000;
// 대학로 300석 이상 중·대극장 (그 외 대학로 소극장은 제외)
const DAEHAKRO_BIG = ["홍익대 대학로","홍익대학교 대학로","대학로아트센터","링크아트센터",
  "유니플렉스 1관","예스24스테이지 1관","동양예술극장 1관","TOM 1관","티오엠 1관",
  "아트원씨어터 1관","드림아트센터 1관","콘텐츠그라운드","플러스씨어터","쇼노트"];

// 서울 주요 대극장 — 티켓 가격과 무관하게 달력에 표시
const SEOUL_BIG = ["예술의전당","세종문화회관","국립극장","LG아트센터","블루스퀘어",
  "샤롯데씨어터","충무아트센터","디큐브","세종S씨어터","국립정동극장","명동예술극장",
  "홍익대 대학로","서울시립","universal","유니버설아트센터","올림픽공원","KSPO",
  "잠실실내체육관","고척","코엑스","한전아트센터","광림아트센터","BBCH","성남아트센터",
  "예스24 라이브홀","백암아트홀","우리금융아트홀","마포아트센터","구로아트밸리"];

// 지방 도시명이 앞에 붙은 동명 공연장(대전예술의전당 등)은 제외
const LOCAL_PREFIX = ["대전","대구","부산","광주","울산","세종","제주","전주","청주","천안",
  "창원","김해","안산","고양","성남","수원","용인","의정부","부천","춘천","강릉","포항","경주",
  "여수","순천","목포","익산","군산","진주","통영","경기","인천","충남","충북","전남","전북",
  "경남","경북","강원"];

// 지방 도시명으로 시작하지만 실제로는 서울 공연장인 예외
const SEOUL_EXCEPTION = ["세종문화회관","세종S씨어터","세종대","경기필","인천공항"];

function isSeoulBig(s){
  const hall = s.공연장 || "";
  const isException = SEOUL_EXCEPTION.some(w => hall.includes(w));
  if (!isException && LOCAL_PREFIX.some(w => hall.startsWith(w))) return false;
  return SEOUL_BIG.some(w => hall.includes(w));
}

function isDaehakroBig(s){
  const hall = s.공연장 || "";
  return DAEHAKRO_BIG.some(w => hall.includes(w));
}

// 달력에 보여줄 공연: 어린이·비전문 공연장을 걸러낸 뒤
// (VIP 16만원 이상) 또는 (대학로 300석 이상 공연장) 인 것만
function visibleMusicals(){
  return musicals.filter(s => {
    if (isKids(s)) return false;
    if (isNonVenue(s)) return false;
    if (isSeoulBig(s)) return true;        // 서울 주요 대극장은 가격 무관
    if (isDaehakroBig(s)) return true;     // 대학로 300석 이상 공연장
    return maxPrice(s) >= CAL_MIN_PRICE;   // 그 외는 VIP 16만원 이상만
  });
}

const castByDate = () => {
  const m = {};
  for(const c of casts){
    if(selShow && c.공연명!==selShow) continue;
    (m[c.날짜] = m[c.날짜]||[]).push(c);
  }
  return m;
};
const showsOnDate = d => visibleMusicals().filter(m => m.시작일 && m.종료일 && m.시작일<=d && d<=m.종료일 && (!selShow||m.공연명===selShow));

function renderCal(){
  $("calMonth").textContent = view.getFullYear()+". "+String(view.getMonth()+1).padStart(2,"0");
  const head=$("calHead"); head.innerHTML="";
  ["일","월","화","수","목","금","토"].forEach((w,i)=>{
    const el=document.createElement("div");el.className="dow"+(i===0?" sun":"");el.textContent=w;head.appendChild(el);
  });

  const map = castByDate();
  const grid=$("calGrid"); grid.innerHTML="";
  grid.parentElement.classList.toggle("stage-dim", !!selActor);
  const first=new Date(view), start=first.getDay(), days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  const today=fmt(new Date());

  for(let i=0;i<start;i++){const c=document.createElement("div");c.className="cell out";grid.appendChild(c)}
  for(let d=1;d<=days;d++){
    const date=fmt(new Date(view.getFullYear(),view.getMonth(),d));
    const cell=document.createElement("div");
    cell.className="cell"+(new Date(view.getFullYear(),view.getMonth(),d).getDay()===0?" sun":"");
    if(date===today)cell.classList.add("today");
    if(date===selDate)cell.classList.add("sel");
    const dayCasts=map[date]||[];
    if(selActor && dayCasts.some(c=>c.배우===selActor)) cell.classList.add("spot");
    cell.innerHTML='<span class="d">'+d+'</span>';
    const dots=document.createElement("div");dots.className="dots";
    const showNames=[...new Set([...dayCasts.map(c=>c.공연명), ...showsOnDate(date).map(s=>s.공연명)])];
    showNames.slice(0,3).forEach(()=>{const s=document.createElement("span");s.className="dot";dots.appendChild(s)});
    cell.appendChild(dots);
    cell.addEventListener("click",()=>{selDate=date;renderCal();renderDay()});
    grid.appendChild(cell);
  }
  renderDay();
}

function parseTicketLinks(예매처){
  if(!예매처) return [];
  return 예매처.split("|").map(seg=>seg.trim()).filter(Boolean).map(seg=>{
    const idx=seg.indexOf("http");
    if(idx===-1) return null;
    const url=seg.slice(idx);
    let name=seg.slice(0,idx).replace(/:\s*$/,"").trim();
    if(!name) name="예매처";
    return {name,url};
  }).filter(Boolean);
}
function linksHtml(예매처){
  return parseTicketLinks(예매처).map(l=>'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.name)+'</a>').join(' · ');
}

function renderDay(){
  const box=$("dayDetail");
  const map=castByDate();
  const dayCasts=map[selDate]||[];
  const dayShows=showsOnDate(selDate);
  const [y,m,d]=selDate.split("-");
  let html='<div class="h">'+Number(m)+'월 '+Number(d)+'일</div>';

  // 이 날짜에 관련된 공연명 = 진행중인 공연 + 캐스트 데이터가 있는 공연
  const names=[...new Set([...dayShows.map(s=>s.공연명), ...dayCasts.map(c=>c.공연명)])].sort();

  if(!names.length){
    html+='<div class="empty"><b>비어 있는 날</b>이 날짜에 진행 중인 공연 정보가 없습니다.</div>';
    box.innerHTML=html; return;
  }

  for(const name of names){
    const show=musicals.find(mu=>mu.공연명===name);
    const casts_=dayCasts.filter(c=>c.공연명===name);
    const links=show?linksHtml(show.예매처):"";

    html+='<div class="slot"><div class="t"><b>'+esc(name)+'</b><span>'+esc(show&&show.공연시간?show.공연시간:"")+'</span></div>';
    // 공연장 · 가격 · 예매처 (항상 표시)
    const info=[];
    if(show&&show.공연장) info.push(esc(show.공연장));
    if(show&&show.티켓가격) info.push(esc(show.티켓가격));
    if(links) info.push(links);
    if(info.length) html+='<div class="castline" style="color:var(--muted)">'+info.join(' · ')+'</div>';
    // 캐스트 — 회차(시간)별로 나눠서 표시
    if(casts_.length){
      const byTime={};
      for(const c of casts_){ (byTime[c.회차||""]=byTime[c.회차||""]||[]).push(c) }
      for(const t of Object.keys(byTime).sort()){
        const lines=byTime[t].map(c=>{
          const actor='<i class="'+(c.배우===selActor?"hl":"")+'">'+esc(c.배우)+'</i>';
          return c.배역?'<u>'+esc(c.배역)+'</u> '+actor:actor;
        }).join(" · ");
        html+='<div class="round">'+(t?'<span class="rt">'+esc(t)+'</span>':"")
             +'<span class="rc">'+lines+'</span></div>';
      }
    }
    html+='</div>';
  }

  box.innerHTML=html;
}

function renderActorChips(){
  // 현재 보고 있는 달에 출연하는 배우만 칩으로 표시
  const y=view.getFullYear(), mo=view.getMonth();
  const first=fmt(new Date(y,mo,1)), last=fmt(new Date(y,mo+1,0));
  const count={};
  for(const c of casts){
    if(selShow&&c.공연명!==selShow)continue;
    if(c.날짜<first||c.날짜>last)continue;
    if(c.배우)count[c.배우]=(count[c.배우]||0)+1;
  }
  const actors=Object.keys(count).sort((a,b)=>count[b]-count[a]).slice(0,40);
  const box=$("actorChips");
  box.innerHTML="";
  box.style.display = actors.length ? "flex" : "none";   // 캐스트 없으면 영역 자체를 숨김
  if(!actors.length) return;
  for(const a of actors){
    const b=document.createElement("button");
    b.className="chip"+(a===selActor?" on":"");b.textContent=a;
    b.addEventListener("click",()=>{selActor=(selActor===a?null:a);renderActorChips();renderCal()});
    box.appendChild(b);
  }
}

function renderShowFilter(){
  // 현재 보고 있는 달에 실제로 공연이 있는 작품만 목록에 넣는다
  const y=view.getFullYear(), mo=view.getMonth();
  const first=fmt(new Date(y,mo,1));
  const last=fmt(new Date(y,mo+1,0));
  const inMonth = m => m.시작일 && m.종료일 && m.시작일<=last && m.종료일>=first;

  const names=[...new Set([
    ...visibleMusicals().filter(inMonth).map(m=>m.공연명),
    ...casts.filter(c=>c.날짜>=first && c.날짜<=last).map(c=>c.공연명),
  ])].sort();

  // 선택 중이던 공연이 이 달에 없으면 전체로 되돌린다
  if(selShow && !names.includes(selShow)) selShow="";

  const sel=$("showFilter");
  sel.innerHTML='<option value="">전체 공연</option>'
    +names.map(n=>'<option'+(n===selShow?" selected":"")+'>'+esc(n)+'</option>').join("");
}

/* ─────────── 공연 목록 ─────────── */
function renderShows(){
  const q=$("showSearch").value.trim();
  const list=$("showList");
  // 기본 목록은 달력과 같은 기준으로 걸러서 보여주고,
  // 검색할 때만 전체 공연에서 찾는다 (숨겨진 공연도 검색으로 조회 가능)
  let items = q ? musicals.filter(s=>(s.공연명||"").includes(q)||(s.공연장||"").includes(q))
                : visibleMusicals();
  if(!items.length){
    list.innerHTML='<div class="empty"><b>'+(q?'검색 결과 없음':'공연 없음')+'</b>'
      +(q?'다른 검색어로 찾아보세요.':'표시할 공연이 없습니다.')+'</div>';return;
  }
  list.innerHTML=items.slice(0,200).map(s=>{
    const img=s.포스터?'<img class="poster" src="'+esc(s.포스터)+'" alt="" loading="lazy">':'<div class="poster"></div>';
    const links=linksHtml(s.예매처);
    return '<div class="m-item">'+img+'<div class="m-info"><div class="name">'+esc(s.공연명)
      +(s.상태==="공연중"?'<span class="badge">공연중</span>':"")+'</div><div class="meta">'
      +esc(s.시작일)+' ~ '+esc(s.종료일)+'<br>'+esc(s.공연장||"")
      +(s.공연시간?'<br><span class="mt">'+esc(s.공연시간)+'</span>':"")
      +(s.티켓가격?'<br><span class="mp">'+esc(s.티켓가격)+'</span>':"")
      +(s.출연진?'<br>'+esc(s.출연진):"")
      +(links?'<br>'+links:"")+'</div></div></div>';
  }).join("");
  if(items.length>200)list.innerHTML+='<div class="empty">'+items.length+'건 중 200건 표시 — 검색으로 좁혀보세요</div>';
}

/* ─────────── 상태 표시 ─────────── */
function stats(){
  const vis=visibleMusicals().length;
  $("dataStat").innerHTML='달력 <b>'+vis+'</b> · 전체 <b>'+musicals.length+'</b>';
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function refreshAll(){stats();renderShowFilter();renderActorChips();renderCal();renderShows()}

/* ─────────── 이벤트 핸들러 ─────────── */
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");$("tab-"+b.dataset.tab).classList.add("on");
}));
$("prevM").addEventListener("click",()=>{view.setMonth(view.getMonth()-1);renderShowFilter();renderActorChips();renderCal()});
$("nextM").addEventListener("click",()=>{view.setMonth(view.getMonth()+1);renderShowFilter();renderActorChips();renderCal()});
$("showFilter").addEventListener("change",e=>{selShow=e.target.value;selActor=null;renderActorChips();renderCal()});
$("showSearch").addEventListener("input",renderShows);


/* ─────────── 서버 자동 동기화 ─────────── */
async function syncFromServer(silent){
  const stat=$("syncStat");
  if(stat && !silent) stat.textContent="동기화 중…";
  try{
    const [m,c] = await Promise.all([
      fetch("data/musicals.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("data/casts.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    let changed=false;
    if(Array.isArray(m)){musicals=m;await save("cc:musicals",musicals);changed=true}
    if(Array.isArray(c)){casts=c;await save("cc:casts",casts);changed=true}
    if(stat){
      const now=new Date();
      const t=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
      stat.innerHTML='동기화 '+t;
    }
    if(changed){refreshAll();if(!silent)toast("최신 데이터로 갱신했습니다")}
  }catch(err){
    if(stat) stat.textContent="갱신 실패 (오프라인?)";
  }
}
$("syncBtn").addEventListener("click",()=>syncFromServer(false));

/* ─────────── 시작 ─────────── */
// 앱 코드가 새 버전으로 바뀌면 자동으로 화면을 갱신한다
if ("serviceWorker" in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(refreshing) return;
    refreshing=true;
    location.reload();          // 새 워커가 제어권을 잡으면 즉시 새 코드로 재시작
  });
  navigator.serviceWorker.register("sw.js").then(reg=>{
    // 새 버전이 대기 중이면 곧바로 활성화시킨다
    if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing;
      if(!nw) return;
      nw.addEventListener("statechange",()=>{
        if(nw.state==="installed" && navigator.serviceWorker.controller){
          nw.postMessage({type:"SKIP_WAITING"});
        }
      });
    });
    reg.update();               // 열 때마다 새 버전이 있는지 확인
  }).catch(()=>{});
  // 앱으로 돌아왔을 때도 새 버전 확인
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"){
      navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
      syncFromServer(true);
    }
  });
}
(async function init(){
  musicals=(await load("cc:musicals"))||[];
  casts=(await load("cc:casts"))||[];
  refreshAll();
  syncFromServer(true);
})();
</script>
