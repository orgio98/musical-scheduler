<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>커튼콜 — 뮤지컬 스케줄러</title>
<style>
  :root{
    --bg:#1B0F14;
    --surface:#2A1A21;
    --surface2:#332028;
    --curtain:#A03448;
    --gold:#E9B44C;
    --gold-soft:rgba(233,180,76,.16);
    --ink:#F5ECE6;
    --muted:#B39AA2;
    --line:rgba(233,180,76,.14);
    --serif:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh
  }

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:0 14px calc(24px + env(safe-area-inset-bottom))
  }

  /* ── 헤더 ── */
  header{
    padding:22px 2px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between
  }

  .brand{
    font-family:var(--serif);
    font-size:26px;
    letter-spacing:.02em
  }

  .brand em{
    font-style:normal;
    color:var(--gold)
  }

  .brand-sub{
    font-size:10.5px;
    letter-spacing:.32em;
    color:var(--muted);
    text-transform:uppercase
  }

  /* ── 탭 ── */
  nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:16px
  }

  nav button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    padding:10px 0;
    border-radius:10px;
    font-size:13.5px;
    font-family:var(--sans);
    cursor:pointer
  }

  nav button.on{
    background:var(--curtain);
